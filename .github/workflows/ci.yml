name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check markdown links (relative paths must resolve)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

      - name: Shellcheck demo scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./demo

      - name: Node syntax check (demo/schema-validation.js)
        run: node --check demo/schema-validation.js
